<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Khet Data Trust</title>
        <link href="https://fonts.googleapis.com/css2?family=Literata:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg: #f6f1e4;
                --card: #fffdf7;
                --ink: #1f2a24;
                --mut: #55606a;
                --line: #ddd5bf;
                --g: #1d3b2a;
                --g2: #2f5a40;
                --gold: #9a7316;
                --goldbg: #f1e3b8;
                --ok: #1f6b3a;
                --bad: #9b2c2c;
                --sl: #3a4752;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top,0px);
                padding-bottom: env(safe-area-inset-bottom,0px)
            }

            @media (prefers-color-scheme: dark) {
                :root:not([data-theme=light]) {
                    --bg:#131d17;
                    --card: #1b2a21;
                    --ink: #efe9d8;
                    --mut: #b4bdb5;
                    --line: #34473b;
                    --g: #8fcba3;
                    --g2: #6db589;
                    --gold: #e0b657;
                    --goldbg: #3b3319;
                    --ok: #7fd69b;
                    --bad: #f09a9a;
                    --sl: #b9c4cf
                }
            }

            * {
                box-sizing: border-box
            }

            html,body {
                margin: 0
            }

            body {
                background: var(--bg);
                color: var(--ink);
                font: 15px/1.55 'Public Sans',system-ui,sans-serif
            }

            h1,h2,h3 {
                font-family: Literata,Georgia,serif;
                margin: 0 0 .5rem;
                line-height: 1.2
            }

            h1 {
                font-size: 1.9rem
            }

            h2 {
                font-size: 1.3rem
            }

            h3 {
                font-size: 1.05rem
            }

            .demo {
                background: var(--gold);
                color: #fff;
                padding: .35rem 1rem;
                font-size: .82rem;
                text-align: center
            }

            .shell {
                display: grid;
                grid-template-columns: 230px 1fr;
                min-height: 100vh
            }

            nav {
                background: var(--g);
                padding: 1rem .6rem;
                position: sticky;
                top: 0;
                align-self: start;
                height: 100vh
            }

            @media (prefers-color-scheme: dark) {
                :root:not([data-theme=light]) nav {
                    background:#0d1511
                }
            }

            nav b {
                display: block;
                color: #f6f1e4;
                font: 700 1.15rem Literata,serif;
                padding: .2rem .6rem 1rem
            }

            nav button {
                display: block;
                width: 100%;
                text-align: left;
                background: none;
                border: 0;
                color: #dfe8dc;
                padding: .55rem .7rem;
                border-radius: 6px;
                font: inherit;
                cursor: pointer
            }

            nav button[aria-current=page] {
                background: #f6f1e4;
                color: #1d3b2a;
                font-weight: 600
            }

            nav button:hover {
                background: #2f5a40;
                color: #fff
            }

            main {
                padding: 1.2rem 1.5rem 3rem;
                max-width: 1100px;
                width: 100%
            }

            .top {
                display: flex;
                gap: .8rem;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 1rem
            }

            .card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 1rem 1.1rem;
                margin-bottom: 1rem
            }

            .grid {
                display: grid;
                gap: 1rem;
                grid-template-columns: repeat(auto-fit,minmax(200px,1fr))
            }

            .grid .card {
                margin: 0
            }

            .big {
                font: 700 1.8rem Literata,serif;
                color: var(--g)
            }

            .mut {
                color: var(--mut);
                font-size: .88rem
            }

            button.b,select,input,textarea {
                font: inherit;
                border-radius: 6px;
                border: 1px solid var(--line);
                padding: .45rem .7rem;
                background: var(--card);
                color: var(--ink)
            }

            button.b {
                cursor: pointer;
                background: var(--g);
                color: #fff;
                border-color: var(--g)
            }

            @media (prefers-color-scheme: dark) {
                :root:not([data-theme=light]) button.b {
                    color:#0d1511
                }
            }

            button.b.o {
                background: none;
                color: var(--g)
            }

            button.b.logout-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: .4rem;
                min-height: 40px;
                min-width: 104px;
                padding: .55rem .9rem;
                background: #9b2c2c!important;
                border: 1px solid #9b2c2c!important;
                color: #fff!important;
                font-weight: 600;
                white-space: nowrap
            }

            button.b.logout-btn:hover {
                background: #7f1d1d!important;
                border-color: #7f1d1d!important
            }

            button.b.d {
                background: var(--bad);
                border-color: var(--bad);
                color: #fff
            }

            button.b:disabled {
                opacity: .45;
                cursor: not-allowed
            }

            :focus-visible {
                outline: 3px solid var(--gold);
                outline-offset: 2px
            }

            table {
                width: 100%;
                border-collapse: collapse;
                font-size: .9rem
            }

            th,td {
                text-align: left;
                padding: .5rem .5rem;
                border-bottom: 1px solid var(--line);
                vertical-align: top
            }

            th {
                color: var(--mut);
                font-weight: 600
            }

            .wrap {
                overflow-x: auto
            }

            .chip {
                display: inline-block;
                padding: .1rem .55rem;
                border-radius: 99px;
                font-size: .78rem;
                font-weight: 600;
                background: var(--line);
                color: var(--ink)
            }

            .Pending,.proposed {
                background: var(--goldbg);
                color: var(--gold)
            }

            .Approved,.active {
                background: #d4ecd9;
                color: #1f6b3a
            }

            .Rejected,.Revoked {
                background: #f3d3d3;
                color: #9b2c2c
            }

            .Expired,.superseded {
                background: #dde3e8;
                color: #3a4752
            }

            @media (prefers-color-scheme: dark) {
                :root:not([data-theme=light]) .Approved,.active {
                    background:#1f3d2a;
                    color: #7fd69b
                }

                .Rejected,.Revoked {
                    background: #4a2323;
                    color: #f09a9a
                }
            }

            .bar {
                background: var(--line);
                border-radius: 4px;
                height: 9px;
                position: relative;
                min-width: 80px
            }

            .bar i {
                display: block;
                height: 100%;
                background: var(--g2);
                border-radius: 4px
            }

            .bar u {
                position: absolute;
                top: -3px;
                bottom: -3px;
                width: 2px;
                background: var(--gold)
            }

            .row {
                display: flex;
                gap: .6rem;
                flex-wrap: wrap;
                align-items: center
            }

            .f {
                display: grid;
                gap: .6rem;
                grid-template-columns: repeat(auto-fit,minmax(220px,1fr))
            }

            .f label {
                display: grid;
                gap: .2rem;
                font-size: .85rem;
                color: var(--mut)
            }

            .tl {
                border-left: 3px solid var(--g2);
                margin-left: .5rem;
                padding-left: 1rem
            }

            .tl div {
                margin-bottom: .7rem;
                position: relative
            }

            .tl div:before {
                content: "";
                position: absolute;
                left: -1.5rem;
                top: .35rem;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--gold)
            }

            .note {
                border-left: 4px solid var(--gold);
                background: var(--goldbg);
                padding: .6rem .8rem;
                border-radius: 0 6px 6px 0;
                font-size: .88rem;
                margin: .6rem 0;
                color: var(--ink)
            }

            .steps {
                display: grid;
                gap: .8rem;
                grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
                margin: 1rem 0
            }

            .steps div {
                border-top: 3px solid var(--gold);
                padding-top: .5rem
            }

            .hash {
                font-family: ui-monospace,monospace;
                font-size: .75rem
            }

            .bad {
                color: var(--bad);
                font-weight: 600
            }

            .ok {
                color: var(--ok);
                font-weight: 600
            }

            #toast {
                position: fixed;
                bottom: 1rem;
                left: 50%;
                transform: translateX(-50%);
                background: var(--g);
                color: #fff;
                padding: .6rem 1rem;
                border-radius: 8px;
                max-width: 90%;
                z-index: 9
            }

            @media (prefers-color-scheme: dark) {
                :root:not([data-theme=light]) #toast {
                    color:#0d1511
                }
            }

            @media (max-width: 760px) {
                .shell {
                    display:block
                }

                nav {
                    position: static;
                    height: auto;
                    display: flex;
                    overflow-x: auto;
                    gap: .2rem;
                    padding: .5rem
                }

                nav b {
                    display: none
                }

                nav button {
                    white-space: nowrap;
                    width: auto
                }

                main {
                    padding: 1rem
                }
            }

            @media (prefers-reduced-motion:no-preference) {
                .card {
                    animation: in .25s ease
                }

                @keyframes in {
                    from {
                        opacity: .4
                    }

                    to {
                        opacity: 1
                    }
                }
            }

            .login-wrap {
                min-height: calc(100vh - 34px);
                display: grid;
                place-items: center;
                padding: 1.5rem
            }

            .login-card {
                width: min(100%,440px);
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 2rem;
                box-shadow: 0 12px 35px #00000012
            }

            .login-card .brand {
                font: 700 1.5rem Literata,Georgia,serif;
                color: var(--g);
                margin-bottom: .5rem
            }

            .login-card form {
                display: grid;
                gap: 1rem;
                margin-top: 1.2rem
            }

            .login-card label {
                display: grid;
                gap: .35rem;
                font-size: .9rem
            }

            .login-card input,.login-card select {
                width: 100%;
                padding: .7rem
            }

            .login-note {
                font-size: .82rem;
                color: var(--mut);
                margin-top: 1rem
            }

            #login-error {
                color: var(--bad);
                font-size: .88rem
            }

            [hidden] {
                display: none!important
            }
        </style>
    </head>
    <body>
        <div class="demo">Demo mode: synthetic data only. All checks run in this browser and are not production security.</div>
        <div id="login-root" class="login-wrap" hidden></div>
        <div class="shell" id="dashboard-shell">
            <nav id="nav" aria-label="Main"></nav>
            <main id="app"></main>
        </div>
        <div id="toast" hidden role="status"></div>
        <script>
            const D = 864e5
              , T0 = Date.UTC(2026, 9, 29, 9, 0)
              , N = 120
              , KEY = 'khet-v1';
            const PUR = ["Academic research", "Government planning", "Commercial product", "Data resale"];
            const OUT = {
                yield_crop: ["Average yield by crop", "ds1"],
                yield_village: ["Average yield by village", "ds1"],
                crop_dist: ["Crop distribution", "ds1"],
                irr_village: ["Irrigation mix by village", "ds3"]
            };
            const DS = [["ds1", "Crop pattern and yield", "Individual records (120)", "Medium", "Kharif and Rabi 2025-26"], ["ds2", "Soil measurements", "Individual records (120)", "High", "Rabi 2025-26"], ["ds3", "Irrigation usage", "Individual records (120)", "Medium", "2025-26"], ["ds4", "Market price trends", "Group-level summary", "Low", "Apr to Sep 2026"]];
            const ORGS = ["Terai Agri Research Institute (demo)", "UP Agriculture Dept. Planning Cell (demo)", "AgriMart Inputs Pvt Ltd (demo)"];
            const NAV = {
                admin: ["Overview", "Farmer Data Registry", "Governance and Voting", "Access Requests", "Privacy Analytics", "Audit Trail", "Benefits and Transparency", "Settings"],
                farmer: ["Overview", "Farmer Data Registry", "Governance and Voting", "Access Requests", "Privacy Analytics", "Audit Trail", "Benefits and Transparency"],
                requester: ["Overview", "Access Requests", "Benefits and Transparency"]
            };
            function rng(s) {
                return () => {
                    s |= 0;
                    s = s + 0x6D2B79F5 | 0;
                    let t = Math.imul(s ^ s >>> 15, 1 | s);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296
                }
            }
            const VIL = [["Rampur", 34], ["Salempur", 28], ["Chiraiya", 26], ["Belghat", 19], ["Nautanwa", 9], ["Pipraich", 4]]
              , CR = [["Wheat", 18], ["Rice", 20], ["Sugarcane", 300], ["Maize", 22], ["Mustard", 7]]
              , IR = ["Tubewell", "Canal", "Rain-fed"];
            const F = ( () => {
                const r = rng(42)
                  , a = [];
                let id = 1;
                VIL.forEach( ([v,n]) => {
                    for (let i = 0; i < n; i++) {
                        const c = CR[Math.floor(r() ** 1.3 * 5)];
                        a.push({
                            id: id++,
                            village: v,
                            crop: c[0],
                            yield: +(c[1] * (0.8 + r() * .4)).toFixed(1),
                            irr: IR[Math.floor(r() * 3)],
                            ph: +(5.8 + r() * 1.8).toFixed(1)
                        })
                    }
                }
                );
                return a
            }
            )();
            const esc = s => String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));
            function hs(s) {
                let h1 = 0xdeadbeef
                  , h2 = 0x41c6ce57;
                for (let i = 0; i < s.length; i++) {
                    const c = s.charCodeAt(i);
                    h1 = Math.imul(h1 ^ c, 2654435761);
                    h2 = Math.imul(h2 ^ c, 1597334677)
                }
                h1 = Math.imul(h1 ^ h1 >>> 16, 2246822507) ^ Math.imul(h2 ^ h2 >>> 13, 3266489909);
                h2 = Math.imul(h2 ^ h2 >>> 16, 2246822507) ^ Math.imul(h1 ^ h1 >>> 13, 3266489909);
                return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16).padStart(14, '0')
            }
            let S;
            function log(actor, action, ds, purpose, decision, pv, detail, ts) {
                const p = S.audit.length ? S.audit[S.audit.length - 1].hash : 'genesis';
                const e = {
                    i: S.audit.length,
                    ts: ts || S.now,
                    actor,
                    action,
                    ds: ds || '-',
                    purpose: purpose || '-',
                    decision: decision || '-',
                    pv: pv || '-',
                    detail: detail || '',
                    prev: p
                };
                e.hash = hs(p + JSON.stringify([e.i, e.ts, actor, e.action, e.ds, e.purpose, e.decision, e.pv, e.detail]));
                S.audit.push(e)
            }
            const rehash = (e, p) => hs(p + JSON.stringify([e.i, e.ts, e.actor, e.action, e.ds, e.purpose, e.decision, e.pv, e.detail]));
            function seed() {
                S = {
                    role: 'admin',
                    view: 'Overview',
                    now: T0,
                    org: ORGS[0],
                    farmer: 7,
                    audit: [],
                    results: {},
                    leak: false,
                    sel: 'ds1',
                    tamper: null,
                    policies: [{
                        v: 1,
                        title: "Baseline research sharing",
                        status: 'active',
                        purposes: ["Academic research"],
                        k: 10,
                        maxDays: 45,
                        thr: .66,
                        quorum: .5,
                        at: T0 - 120 * D
                    }, {
                        v: 2,
                        title: "Add government planning use",
                        status: 'proposed',
                        purposes: ["Academic research", "Government planning"],
                        k: 10,
                        maxDays: 45,
                        thr: .66,
                        quorum: .5,
                        at: T0 - 14 * D
                    }],
                    votes: {
                        1: {},
                        2: {}
                    },
                    requests: [],
                    ledger: []
                };
                for (let i = 1; i <= 100; i++)
                    S.votes[1][i] = i % 10 == 0 ? 'against' : i % 17 == 0 ? 'abstain' : 'for';
                for (let i = 20; i <= 77; i++)
                    S.votes[2][i] = i <= 60 ? 'for' : i <= 72 ? 'against' : 'abstain';
                const A = 'FPO Admin';
                log(A, 'policy proposed', null, null, 'Open for voting', 1, 'Baseline research sharing', T0 - 120 * D);
                log('Members', 'votes closed', null, null, 'Approved', 1, 'Quorum met, approval above 66%', T0 - 110 * D);
                log(A, 'policy activated', null, null, 'Active', 1, '', T0 - 110 * D);
                S.requests = [{
                    id: 'R-101',
                    org: ORGS[0],
                    purpose: "Academic research",
                    ds: 'ds1',
                    out: 'yield_crop',
                    days: 30,
                    contact: 'research@terai-demo.example',
                    status: 'Expired',
                    at: T0 - 90 * D,
                    apv: 1,
                    exp: T0 - 60 * D,
                    reason: 'Matched policy v1: academic research, 30 days.',
                    rel: 1
                }, {
                    id: 'R-102',
                    org: ORGS[0],
                    purpose: "Academic research",
                    ds: 'ds1',
                    out: 'yield_crop',
                    days: 30,
                    contact: 'research@terai-demo.example',
                    status: 'Pending',
                    at: T0 - 2 * D,
                    reason: '',
                    rel: 0
                }, {
                    id: 'R-103',
                    org: ORGS[2],
                    purpose: "Commercial product",
                    ds: 'ds1',
                    out: 'crop_dist',
                    days: 90,
                    contact: 'data@agrimart-demo.example',
                    status: 'Pending',
                    at: T0 - D,
                    reason: '',
                    rel: 0
                }];
                log(ORGS[0], 'request submitted', 'ds1', "Academic research", 'Pending', 1, 'R-101', T0 - 90 * D);
                log(A, 'request approved', 'ds1', "Academic research", 'Approved', 1, 'R-101 for 30 days', T0 - 90 * D);
                log(ORGS[0], 'data released', 'ds1', "Academic research", 'Allowed', 1, 'R-101 average yield by crop', T0 - 89 * D);
                log('System', 'access expired', 'ds1', "Academic research", 'Expired', 1, 'R-101', T0 - 60 * D);
                log(A, 'policy proposed', null, null, 'Open for voting', 2, 'Add government planning use', T0 - 14 * D);
                log(ORGS[0], 'request submitted', 'ds1', "Academic research", 'Pending', 1, 'R-102', T0 - 2 * D);
                log(ORGS[2], 'request submitted', 'ds1', "Commercial product", 'Pending', 1, 'R-103', T0 - D);
                S.ledger = [{
                    ts: T0 - 89 * D,
                    d: 'Research data-use contribution from R-101 (simulated)',
                    a: 5000
                }, {
                    ts: T0 - 70 * D,
                    d: 'Soil-testing camp for members (simulated)',
                    a: -3500
                }]
            }
            function load() {
                try {
                    const j = localStorage.getItem(KEY);
                    if (j) {
                        S = JSON.parse(j);
                        return
                    }
                } catch (e) {}
                seed()
            }
            function save() {
                try {
                    localStorage.setItem(KEY, JSON.stringify(S))
                } catch (e) {}
            }
            const act_ = () => S.policies.find(p => p.status == 'active')
              , fmt = t => new Date(t).toISOString().slice(0, 10)
              , tally = v => {
                const o = {
                    for: 0,
                    against: 0,
                    abstain: 0
                };
                Object.values(S.votes[v]).forEach(x => o[x]++);
                return o
            }
            ;
            function toast(m) {
                const t = document.getElementById('toast');
                t.textContent = m;
                t.hidden = false;
                clearTimeout(toast.t);
                toast.t = setTimeout( () => t.hidden = true, 3500)
            }
            function evalP(p) {
                if (p.status != 'proposed')
                    return;
                const t = tally(p.v)
                  , cast = t.for + t.against + t.abstain;
                if (cast >= Math.ceil(p.quorum * N) && t.for + t.against > 0 && t.for / (t.for + t.against) >= p.thr) {
                    const o = act_();
                    if (o)
                        o.status = 'superseded';
                    p.status = 'active';
                    log('Members', 'votes closed', null, null, 'Approved', p.v, `${t.for} for, ${t.against} against, ${t.abstain} abstain`);
                    log('System', 'policy activated', null, null, 'Active', p.v, p.title)
                }
            }
            function agg(out, k) {
                const rows = [];
                const grp = (key, list) => {
                    const m = {};
                    F.forEach(f => (m[f[key]] = m[f[key]] || []).push(f));
                    return Object.entries(m).filter( ([a]) => !list || list.includes(a))
                }
                ;
                if (out == 'yield_crop' || out == 'yield_village')
                    grp(out == 'yield_crop' ? 'crop' : 'village').forEach( ([l,a]) => {
                        const sup = a.length < k;
                        rows.push({
                            l,
                            sup,
                            v: sup ? null : +(a.reduce( (s, x) => s + x.yield, 0) / a.length).toFixed(1),
                            u: 'q/acre',
                            n: sup ? null : a.length
                        })
                    }
                    );
                if (out == 'crop_dist')
                    grp('crop').forEach( ([l,a]) => {
                        const sup = a.length < k;
                        rows.push({
                            l,
                            sup,
                            v: sup ? null : +(a.length / N * 100).toFixed(1),
                            u: '% of members',
                            n: sup ? null : a.length
                        })
                    }
                    );
                if (out == 'irr_village')
                    grp('village').forEach( ([l,a]) => {
                        const sup = a.length < k;
                        rows.push({
                            l,
                            sup,
                            t: sup ? null : IR.map(i => {
                                const c = a.filter(x => x.irr == i).length;
                                return c < k ? `${i}: suppressed` : `${i} ${Math.round(c / a.length * 100)}%`
                            }
                            ).join(', '),
                            n: sup ? null : a.length
                        })
                    }
                    );
                return rows
            }
            function status() {
                const exp = [];
                S.requests.forEach(r => {
                    if (r.status == 'Approved' && S.now > r.exp) {
                        r.status = 'Expired';
                        log('System', 'access expired', r.ds, r.purpose, 'Expired', r.apv, r.id)
                    }
                }
                )
            }
            function release(r) {
                const a = act_()
                  , den = (w) => {
                    log(r.org, 'access denied', r.ds, r.purpose, 'Denied', a.v, r.id + ': ' + w);

                const small = Object.entries(cells).filter( ([k,v]) => v.length <= 2).slice(0, 5);
                return `<h2>Privacy Analytics</h2><div class="card"><h3>What requesters can see now (min group size ${a.k})</h3>${Object.keys(OUT).map(o => `<h3 style="margin-top:.8rem;font-size:.95rem">${OUT[o][0]}</h3><div class="wrap"><table>${agg(o, a.k).map(y => `<tr><td>${y.l}</td><td>${y.sup ? `<i class="mut">Suppressed</i>` : y.t ? esc(y.t) : y.v + ' ' + y.u}</td></tr>`).join('')}</table></div>`).join('')}</div>
<div class="card" id="sim"><h3>What-if policy simulator</h3><div class="f"><label>Minimum group size <input id="sk2" type="range" min="3" max="30" value="${a.k}"></label><label>Maximum duration (days)<input id="sd2" type="number" value="${a.maxDays}"></label></div><div class="row" style="margin:.5rem 0">${PUR.slice(0, 3).map( (x, i) => `<label><input type="checkbox" id="sp${i}" ${a.purposes.includes(x) ? 'checked' : ''}> ${x}</label>`).join('')}</div><div class="note" id="simout"></div></div>
<div class="card"><h3>Privacy leak demonstration</h3><p>A very narrow query can describe one person. Below, synthetic village and crop combinations with only one or two farmers.</p><button class="b o" data-a="leak">${S.leak ? 'Turn protections off' : 'Turn protections on'}</button><div class="wrap"><table><tr><th>Query</th><th>Answer</th></tr>${small.map( ([k,v]) => `<tr><td>Average yield, ${k}</td><td>${S.leak ? `<span class="ok">Suppressed: group smaller than ${a.k}</span>` : `<span class="bad">${(v.reduce( (s, x) => s + x.yield, 0) / v.length).toFixed(1)} q/acre from ${v.length} farmer(s). That is ${v.length == 1 ? 'one person\'s yield (synthetic farmer #' + v[0].id + ')' : 'almost one person\'s yield'}.</span>`}</td></tr>`).join('')}</table></div>
<p class="mut">Protections: minimum group size, one grouping dimension per output, no free filters, a budget of 3 releases per approval so differences between repeated queries cannot isolate a farmer. These reduce risk but do not guarantee anonymity.</p></div>`
            }
            function vAudit() {
                const vr = S.vr;
                return `<h2>Audit Trail</h2><div class="card"><div class="row"><button class="b" data-a="verify">Verify hash chain</button><button class="b o" data-a="tamper" ${S.tamper ? 'disabled' : ''}>Tamper with entry 4 (demo)</button><button class="b o" data-a="undo" ${S.tamper ? '' : 'disabled'}>Undo tamper</button>${vr == null ? '' : vr < 0 ? '<span class="ok">Chain intact. No modification found.</span>' : `<span class="bad">Chain broken at entry ${vr}. Entry was modified.</span>`}</div><p class="mut">Each entry stores the hash of the previous entry, so editing one changes every later hash. This local log is tamper-evident only. It is not a production-grade immutable ledger.</p></div><div class="card wrap"><table><tr><th>#</th><th>Time</th><th>Actor</th><th>Action</th><th>Dataset</th><th>Purpose</th><th>Decision</th><th>Policy</th><th>Hash</th></tr>${S.audit.slice().reverse().map(e => `<tr><td>${e.i}</td><td>${fmt(e.ts)}</td><td>${esc(e.actor)}</td><td>${esc(e.action)}<div class="mut">${esc(e.detail)}</div></td><td>${e.ds}</td><td>${esc(e.purpose)}</td><td>${esc(e.decision)}</td><td>v${e.pv}</td><td class="hash">${e.hash.slice(0, 8)}</td></tr>`).join('')}</table></div>`
            }
            function vBen() {
                const bal = S.ledger.reduce( (s, x) => s + x.a, 0)
                  , used = S.requests.filter(r => r.rel > 0);
                return `<h2>Benefits and Transparency</h2><div class="card"><h3>What was used and shared</h3>${used.length ? `<table>${used.map(r => `<tr><td>${r.id} ${esc(r.org)}</td><td>${DS.find(d => d[0] == r.ds)[1]}</td><td>${r.purpose}</td><td>${OUT[r.out][0]} (${r.rel} release${r.rel > 1 ? 's' : ''})</td></tr>`).join('')}</table>` : '<p class="mut">No group-level outputs released yet. Approve a request and run it as a requester.</p>'}</div>
<div class="card"><h3>Community benefit ledger <span class="chip Pending">Simulated</span></h3><p class="mut">All amounts are hypothetical and not connected to any payment system.</p><table>${S.ledger.map(x => `<tr><td>${fmt(x.ts)}</td><td>${esc(x.d)}</td><td>${x.a < 0 ? '-' : ''}₹${Math.abs(x.a).toLocaleString('en-IN')}</td></tr>`).join('')}<tr><th colspan="2">Simulated balance</th><th>₹${bal.toLocaleString('en-IN')}</th></tr></table></div>
<div class="card"><h3>How collective decisions shape governance</h3><p>Policy v${act_().v} was approved by member vote. It allows ${act_().purposes.join(' and ').toLowerCase()}, requires groups of at least ${act_().k}, and prohibits resale. Changing any of these needs a new vote.</p></div>`
            }
            function vSet() {
                const a = act_();
                return `<h2>Settings</h2><div class="card"><h3>Minimum group size (policy v${a.v})</h3><div class="row"><input id="sk" type="number" min="3" max="50" value="${a.k}"><button class="b" data-a="setk">Save and log change</button></div><p class="mut">In a real deployment this would require a new member vote. Here the change is logged.</p></div><div class="card"><h3>Demo data</h3><p class="mut">Data is deterministic synthetic data stored in your browser only.</p><button class="b d" data-a="reset">Reset demo</button></div>`
            }
            const V = {
                "Overview": vOverview,
                "Farmer Data Registry": vRegistry,
                "Governance and Voting": vGov,
                "Access Requests": vReq,
                "Privacy Analytics": vPriv,
                "Audit Trail": vAudit,
                "Benefits and Transparency": vBen,
                "Settings": vSet
            };
            function render() {
                const loginRoot = document.getElementById('login-root')
                  , shell = document.getElementById('dashboard-shell');
                let auth = null;
                try {
                    auth = JSON.parse(sessionStorage.getItem('khet-demo-session') || 'null')
                } catch (e) {}
                if (!auth || !auth.name || !auth.role) {
                    shell.hidden = true;
                    loginRoot.hidden = false;
                    loginRoot.innerHTML = `<section class="login-card"><div class="brand">Khet Data Trust</div><h1>Sign in</h1><p class="mut">Farmers control their shared data</p>
 <div class="note">Demo login only. This prototype has no backend authentication. Any non-empty password will work; do not use a real password.</div>
 <form id="login-form"><label>Name<input name="name" autocomplete="name" required maxlength="80" placeholder="Enter your name"></label>
 <label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="Enter any demo password"></label>
 <label>Sign In As<select name="role" required><option value="farmer">Farmer</option><option value="admin">FPO Administrator</option><option value="requester">Data Requestor</option></select></label>
 <p id="login-error" role="alert" hidden></p><button class="b" type="submit">Sign in</button></form>
 <p class="login-note">Synthetic data only · Demo credentials are not verified or stored.</p></section>`;
                    document.getElementById('login-form').addEventListener('submit', e => {
                        e.preventDefault();
                        const fd = new FormData(e.currentTarget)
                          , name = String(fd.get('name') || '').trim()
                          , password = String(fd.get('password') || '')
                          , role = String(fd.get('role') || 'farmer');
                        if (!name || !password) {
                            const er = document.getElementById('login-error');
                            er.textContent = 'Enter a name and demo password.';
                            er.hidden = false;
                            return
                        }
                        sessionStorage.setItem('khet-demo-session', JSON.stringify({
                            name,
                            role
                        }));
                        S.role = role;
                        S.view = 'Overview';
                        save();
                        render()
                    }
                    );
                    return;
                }
                S.role = auth.role;
                shell.hidden = false;
                loginRoot.hidden = true;
                if (!NAV[S.role].includes(S.view))
                    S.view = 'Overview';
                document.getElementById('nav').innerHTML = '<b>Khet Data Trust</b>' + NAV[S.role].map(n => `<button data-a="nav" data-v="${n}" ${n == S.view ? 'aria-current="page"' : ''}>${n}</button>`).join('');
                document.getElementById('app').innerHTML = `<div class="top"><div><div class="mut">Farmers Control Their Shared Data</div><div class="mut">Signed in as ${esc(auth.name)} · ${S.role == 'admin' ? 'FPO Administrator' : S.role == 'requester' ? 'Data Requestor' : 'Farmer'}</div></div><div class="row">${S.role == 'requester' ? `<select id="os" aria-label="Organization">${ORGS.map(o => `<option ${o == S.org ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>` : ''}<button type="button" class="b logout-btn" data-a="logout" aria-label="Log out of Khet Data Trust"><span aria-hidden="true">↪</span><span>Log out</span></button></div></div>` + V[S.view]();
                const os = document.getElementById('os');
                if (os)
                    os.onchange = e => {
                        S.org = e.target.value;
                        save();
                        render()
                    }
                    ;
                if (document.getElementById('sim'))
                    simOut()
            }
            document.addEventListener('click', e => {
                const b = e.target.closest('[data-a]');
                if (b && !b.disabled)
                    act(b.dataset.a, b.dataset)
            }
            );
            document.addEventListener('input', e => {
                if (e.target.closest('#sim'))
                    simOut()
            }
            );
            load();
            status();
            render();
        </script>
    </body>
</html>
